services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aplive
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: aplive
    ports: ["5432:5432"]
    volumes: ["aplive_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
volumes:
  aplive_pg:
