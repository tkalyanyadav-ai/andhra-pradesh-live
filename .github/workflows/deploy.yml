name: Deploy Andhra Pradesh Live
concurrency:
  group: andhra-pradesh-live-production-${{ github.ref }}
  cancel-in-progress: false
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Create or find Cloudflare D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          EXISTING=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API?name=andhra-pradesh-live-db")
          DB_ID=$(echo "$EXISTING" | jq -r '.result[]? | select(.name=="andhra-pradesh-live-db") | .uuid' | head -n 1)
          if [ -z "$DB_ID" ]; then
            CREATED=$(curl --fail-with-body --silent --show-error -X POST "$API" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"andhra-pradesh-live-db"}')
            echo "$CREATED" | jq -e '.success == true' >/dev/null
            DB_ID=$(echo "$CREATED" | jq -r '.result.uuid')
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "D1 database is ready."
      - name: Set D1 database ID in Wrangler config
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "wrangler.jsonc"
          with open(path, encoding="utf-8") as f:
              config = json.load(f)
          config["d1_databases"][0]["database_id"] = os.environ["D1_DATABASE_ID"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY
      - name: Build Cloudflare Worker
        run: npx opennextjs-cloudflare build
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply andhra-pradesh-live-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Smoke test deployed portal and collector configuration
        env:
          WORKER_URL: https://andhra-pradesh-live.tkalyan-yadav.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/" >/dev/null
          curl --fail --silent --show-error "$WORKER_URL/api/health" -o /tmp/health.json
          python3 - <<'PY'
          import json
          with open("/tmp/health.json", encoding="utf-8") as f:
              health = json.load(f)
          assert health.get("status") == "ok", health
          assert health.get("database") == "connected", health
          collector = health.get("collector", {})
          assert collector.get("configured") is True, health
          assert collector.get("geminiConfigured") is True, "GEMINI_API_KEY is not available to the Worker"
          assert collector.get("officialSources") == 4, health
          assert collector.get("newsFeeds") == 87, health
          assert collector.get("sportsFeeds") == 23, health
          assert collector.get("entertainmentFeeds") == 23, health
          print("Smoke test passed: homepage, D1, Gemini secret, four official sources, 87 total news feeds, 23 sports feeds and 23 entertainment feeds.")
          PY
          curl --fail --silent --show-error "$WORKER_URL/api/content/districts?limit=30" -o /tmp/districts.json
          python3 - <<'PY'
          import json
          with open("/tmp/districts.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("configured") is True, data
          assert len(data.get("items", [])) == 28, data
          print("Smoke test passed: 28 district records are available.")
          PY
