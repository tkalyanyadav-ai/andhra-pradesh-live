name: Validate Andhra Pradesh Live
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Validate production deployment workflow YAML
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/deploy.yml")'
      - name: Cloudflare production build
        run: npx opennextjs-cloudflare build
